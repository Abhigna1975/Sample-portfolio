name: Deploy to GitHub Pages

on:
  push:
    branches: [ first ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build

    - name: Fix all paths manually
      run: |
        find build -name "*.html" -type f -exec sed -i 's|="/static/|="/Sample-portfolio/static/|g' {} \;
        find build -name "*.html" -type f -exec sed -i 's|="/favicon.ico"|="/Sample-portfolio/favicon.ico"|g' {} \;
        find build -name "*.html" -type f -exec sed -i 's|="/logo192.png"|="/Sample-portfolio/logo192.png"|g' {} \;
        find build -name "*.html" -type f -exec sed -i 's|="/manifest.json"|="/Sample-portfolio/manifest.json"|g' {} \;
        find build -name "*.js" -type f -exec sed -i 's|"/static/|"/Sample-portfolio/static/|g' {} \;
        find build -name "*.css" -type f -exec sed -i 's|"/static/|"/Sample-portfolio/static/|g' {} \;

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        force_orphan: true
